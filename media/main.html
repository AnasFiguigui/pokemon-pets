<!DOCTYPE html>
<html lang="en">
    <!-- Info -->
    <head>
        <title>Pokemon Pets </title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {cspSource}; style-src {cspSource} 'unsafe-inline'; font-src {cspSource}; script-src {cspSource};">

        <!-- Preload font & menus image -->
        <link rel="preload" href="{media}fonts/Pokemon.otf" as="font" type="font/otf">
        <link rel="preload" href="{media}sprites/ui/menu.png" as="image" type="image/png">

        <!-- Styling -->
        <link rel="stylesheet" href="{media}main.css">
    </head>

    <!-- Content (all event handlers are wired in main.js — no inline script) -->
    <body media="{media}" hide style="display:none">
        <!-- Game -->
        <div id="background">
            <!-- Game canvas -->
            <canvas id="canvas"></canvas>
        </div>

        <!-- Decor mode -->
        <div id="decor">
            <!-- Controls -->
            <span id="decorHelp">Drag to place</span>

            <!-- Three most recently placed shop items -->
            <div id="buildShortcuts" class="buildShortcuts" role="toolbar" aria-label="Recent build items">
                <button type="button" class="buildShortcutSlot" aria-label="Empty recent build slot" disabled></button>
                <button type="button" class="buildShortcutSlot" aria-label="Empty recent build slot" disabled></button>
                <button type="button" class="buildShortcutSlot" aria-label="Empty recent build slot" disabled></button>
            </div>

            <!-- Toggle action, shop shortcut & exit buttons -->
            <div id="decorButtons" class="decorButtons" role="toolbar">
                <!-- Toggle action -->
                <button type="button" id="decorActionBtn" class="menu" button show>
                    <span id="decorAction">Mode</span>
                </button>

                <!-- Finalize placement and reopen the last visited shop page -->
                <button type="button" id="decorShopBtn" class="menu" button show title="Open last shop page" aria-label="Open last shop page">
                    <span>+</span>
                </button>

                <!-- Exit decor mode -->
                <button type="button" id="decorCloseBtn" class="menu" button show>
                    <span>Close</span>
                </button>
            </div>
        </div>

        <!-- Messages -->
        <div id="messages"></div>

        <!-- Night overlay (darkens scene; lamps punch transparent holes via CSS mask) -->
        <div id="lamp-glow"></div>
        <div id="night-overlay"></div>

        <!-- Menus -->
        <div id="menus" role="dialog">
            <!-- Actions menu -->
            <div id="actions" class="menu" role="menu">
                <div class="menuTopBar">
                    <span></span>
                    <button id="actionsCloseBtn" class="menuTopButton">X</button>
                </div>
                <div id="actionsContent" class="menuContent" scrollable>
                    <!-- Buttons -->
                    <button type="button" id="actionsBallBtn" class="menuButton">
                        <img src="{media}sprites/ui/ball.png" alt="Poké Ball">
                        <span>Throw Poké Ball</span>
                    </button>
                    <button type="button" id="actionsPokedexBtn" class="menuButton">
                        <img src="{media}sprites/ui/pokedex.png" alt="Pokédex">
                        <span>Pokédex</span>
                    </button>
                    <button type="button" id="actionsBadgesBtn" class="menuButton">
                        <img src="{media}sprites/ui/badge.png" alt="Badges">
                        <span>Badges</span>
                    </button>
                    <button type="button" id="actionsBackpackBtn" class="menuButton">
                        <img src="{media}sprites/ui/backpack.png" alt="Backpack">
                        <span>Backpack</span>
                    </button>
                    <button type="button" id="actionsStoreBtn" class="menuButton">
                        <img src="{media}sprites/ui/house.png" alt="Item Shop">
                        <span>Item Shop</span>
                    </button>
                    <button type="button" id="actionsDecorBtn" class="menuButton">
                        <img src="{media}sprites/ui/build.png" alt="Build Mode">
                        <span id="actionsDecor">Enter Build Mode</span>
                    </button>

                </div>
            </div>

            <!-- Store menu -->
            <div id="store" class="menu" role="menu">
                <div class="menuTopBar">
                    <button id="storeBackBtn" class="menuTopButton">Back</button>
                    <button id="storeCloseBtn" class="menuTopButton">X</button>
                </div>
                <div id="storeContent" class="menuContent" scrollable>
                    <!-- Items -->
                </div>
            </div>

            <!-- Backpack menu -->
            <div id="backpack" class="menu" role="menu">
                <div class="menuTopBar">
                    <button id="backpackBackBtn" class="menuTopButton">Back</button>
                    <button id="backpackCloseBtn" class="menuTopButton">X</button>
                </div>
                <div id="backpackContent" class="menuContent" scrollable>
                    <!-- Items populated by JS -->
                </div>
            </div>

            <!-- Pokédex menu -->
            <div id="pokedex" class="menu" role="menu">
                <div class="menuTopBar">
                    <button id="pokedexBackBtn" class="menuTopButton">Back</button>
                    <button id="pokedexCloseBtn" class="menuTopButton">X</button>
                </div>
                <div id="pokedexContent" class="menuContent" scrollable>
                    <!-- Pokédex entries populated by JS -->
                </div>
            </div>

            <!-- Badges & daily calendar menu -->
            <div id="badgesMenu" class="menu" role="menu">
                <div class="menuTopBar">
                    <button id="badgesBackBtn" class="menuTopButton">Back</button>
                    <button id="badgesCloseBtn" class="menuTopButton">X</button>
                </div>
                <div class="badgeTabs" role="tablist">
                    <button type="button" id="badgeTabBadges" class="badgeTab" role="tab" active>Badges</button>
                    <button type="button" id="badgeTabCalendar" class="badgeTab" role="tab">Calendar</button>
                </div>
                <div id="badgesContent" class="menuContent" scrollable>
                    <!-- Populated by JS -->
                </div>
                <!-- Selected badge details live OUTSIDE the scroll area so the
                     grid never collapses when a description is open -->
                <div id="badgeDetailDock" hidden></div>
            </div>

        </div>

        <!-- Top bar -->
        <div id="topBar">
            <span class="topBarBalance">
                <img src="{media}sprites/ui/gold.png" alt="Gold" class="topBarIcon">
                <span id="moneyText">0</span>
            </span>
            <button type="button" id="pokedexBtn" class="topBarItem">
                <img src="{media}sprites/ui/pokedex.png" alt="Pokédex" class="topBarIcon">
            </button>
            <button type="button" id="backpackBtn" class="topBarItem">
                <img src="{media}sprites/ui/backpack.png" alt="Backpack" class="topBarIcon">
            </button>
            <button type="button" id="candyBtn" class="topBarItem">
                <img src="{media}sprites/ui/candy.png" alt="Candy" class="topBarIcon">
                <span id="candyText">0</span>
            </button>
        </div>

        <!-- Cursor -->
        <div id="cursor"></div>
    </body>

    <!-- Scripts -->
    <script src="{media}core/base.js"></script>
    <script src="{media}core/runtime.js"></script>
    <script src="{media}characters/pets.js"></script>
    <script src="{media}characters/wild-pokemons.js"></script>
    <script src="{media}decoration/layers.js"></script>
    <script src="{media}decoration/presets.js"></script>
    <script src="{media}decoration/object.js"></script>
    <script src="{media}decoration/plant.js"></script>
    <script src="{media}main.js"></script>
</html>
