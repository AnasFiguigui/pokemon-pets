<!DOCTYPE html>
<html lang="en">
    <!-- Info -->
    <head>
        <title>Pokemon Pets </title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {cspSource}; style-src {cspSource} 'unsafe-inline'; font-src {cspSource}; script-src 'unsafe-inline' {cspSource};">

        <!-- Preload font & menus image -->
        <link rel="preload" href="{media}fonts/Pokemon.otf" as="font" type="font/otf">
        <link rel="preload" href="{media}sprites/ui/menu.png" as="image" type="image/png">

        <!-- Styling -->
        <link rel="stylesheet" href="{media}main.css">

        <!-- Scripts -->
    </head>

    <!-- Content -->
    <body media="{media}" hide style="display:none">
        <!-- Game -->
        <div id="background">
            <!-- Game canvas -->
            <canvas id="canvas"></canvas>
        </div>

        <!-- Decor mode -->
        <div id="decor">
            <!-- Controls -->
            <span id="decorHelp">Drag to place</span>
            
            <!-- Toggle action & exit buttons -->
            <div class="decorButtons" onmousedown="event.stopPropagation();" onmouseup="event.stopPropagation();">
                <!-- Toggle action -->
                <button type="button" class="menu" button show onclick="DecorMode.toggleAction();">
                    <span id="decorAction">Mode</span>
                </button>

                <!-- Exit decor mode -->
                <button type="button" class="menu" button show onclick="DecorMode.toggle(false);">
                    <span>Close</span>
                </button>
            </div>
        </div>

        <!-- Messages -->
        <div id="messages"></div>

        <!-- Night overlay (darkens scene; lamps punch transparent holes via CSS mask) -->
        <div id="lamp-glow"></div>
        <div id="night-overlay"></div>

        <!-- Menus -->
        <div id="menus" onclick="Menus.close();" onkeydown="if(event.key==='Escape')Menus.close();" onmousedown="event.stopPropagation();" onmouseup="event.stopPropagation();">
            <!-- Actions menu -->
            <div id="actions" class="menu" onclick="event.stopPropagation();" onkeydown="event.stopPropagation();">
                <div class="menuTopBar">
                    <span></span>
                    <button id="actionsCloseBtn" class="menuTopButton" onclick="Menus.close();">X</button>
                </div>
                <div id="actionsContent" class="menuContent" scrollable>
                    <!-- Buttons -->
                    <button type="button" class="menuButton" onclick="toggleActionBall();">
                        <img src="{media}sprites/ui/ball.png" alt="Poké Ball">
                        <span>Throw Poké Ball</span>
                    </button>
                    <button type="button" class="menuButton" onclick="openPokedex();">
                        <img src="{media}sprites/ui/pokedex.png" alt="Pokédex">
                        <span>Pokédex</span>
                    </button>
                    <button type="button" class="menuButton" onclick="openBackpack();">
                        <img src="{media}sprites/ui/backpack.png" alt="Backpack">
                        <span>Backpack</span>
                    </button>
                    <button type="button" class="menuButton" onclick="openStoreMenu();">
                        <img src="{media}sprites/ui/house.png" alt="Item Shop">
                        <span>Item Shop</span>
                    </button>
                    <button type="button" class="menuButton" onclick="toggleActionDecor();">
                        <img src="{media}sprites/ui/build.png" alt="Build Mode">
                        <span id="actionsDecor">Enter Build Mode</span>
                    </button>
                    <button type="button" class="menuButton" onclick="requestRenamePet();">
                        <img src="{media}sprites/ui/pokedex.png" alt="Rename">
                        <span>Rename Pokémon</span>
                    </button>
                </div>
            </div>

            <!-- Store menu -->
            <div id="store" class="menu" onclick="event.stopPropagation();" onkeydown="event.stopPropagation();">
                <div class="menuTopBar">
                    <button id="storeBackBtn" class="menuTopButton" onclick="openStoreMenu();">Back</button>
                    <button id="storeCloseBtn" class="menuTopButton" onclick="Menus.close();">X</button>
                </div>
                <div id="storeContent" class="menuContent" scrollable>
                    <!-- Items -->
                </div>
            </div>

            <!-- Backpack menu -->
            <div id="backpack" class="menu" onclick="event.stopPropagation();" onkeydown="event.stopPropagation();">
                <div class="menuTopBar">
                    <button class="menuTopButton" onclick="Menus.toggle('actions', true);">Back</button>
                    <button class="menuTopButton" onclick="Menus.close();">X</button>
                </div>
                <div id="backpackContent" class="menuContent" scrollable>
                    <!-- Items populated by JS -->
                </div>
            </div>

            <!-- Pokédex menu -->
            <div id="pokedex" class="menu" onclick="event.stopPropagation();" onkeydown="event.stopPropagation();">
                <div class="menuTopBar">
                    <button class="menuTopButton" onclick="Menus.toggle('actions', true);">Back</button>
                    <button class="menuTopButton" onclick="Menus.close();">X</button>
                </div>
                <div id="pokedexContent" class="menuContent" scrollable>
                    <!-- Pokédex entries populated by JS -->
                </div>
            </div>

        </div>

        <!-- Top bar -->
        <div id="topBar">
            <img src="{media}sprites/ui/gold.png" alt="Gold" class="topBarIcon">
            <span id="moneyText">0</span>
            <button type="button" id="pokedexBtn" class="topBarItem" onclick="openPokedex();">
                <img src="{media}sprites/ui/pokedex.png" alt="Pokédex" class="topBarIcon">
            </button>
            <button type="button" id="backpackBtn" class="topBarItem" onclick="openBackpack();">
                <img src="{media}sprites/ui/backpack.png" alt="Backpack" class="topBarIcon">
            </button>
            <button type="button" id="candyBtn" class="topBarItem" onclick="selectConsumable('candy');">
                <img src="{media}sprites/ui/candy.png" alt="Candy" class="topBarIcon">
                <span id="candyText">0</span>
            </button>
        </div>

        <!-- Cursor -->
        <div id="cursor"></div>
    </body>

    <!-- Scripts -->
    <script src="{media}core/base.js"></script>
    <script src="{media}core/runtime.js"></script>
    <script src="{media}characters/pets.js"></script>
    <script src="{media}characters/wild-pokemons.js"></script>
    <script src="{media}decoration/layers.js"></script>
    <script src="{media}decoration/presets.js"></script>
    <script src="{media}decoration/object.js"></script>
    <script src="{media}decoration/plant.js"></script>
    <script src="{media}main.js"></script>
</html>
